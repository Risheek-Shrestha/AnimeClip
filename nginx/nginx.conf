worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Rate-limit zones ─────────────────────────────────────────────────────
    # General: 20 req/s per IP, burst 40.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    # Auth: 5 req/min per IP to protect login/signup.
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;
    # Analytics write API: 60 req/min per IP.
    limit_req_zone $binary_remote_addr zone=analytics:10m rate=60r/m;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers (belt-and-suspenders alongside Django's middleware)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Content Security Policy
        # – default-src 'self'          only our own origin by default
        # – script-src  'self' + blob:  HLS.js creates blob: worker URLs
        # – media-src   'self' blob: https://res.cloudinary.com
        #               covers HLS .ts segments and signed MP4 redirects
        # – img-src     adds data: for base64 thumbnails and Cloudinary CDN
        # – connect-src adds Cloudinary (API upload widget) and Sentry DSN
        # – frame-ancestors 'none'      belt-and-suspenders vs X-Frame-Options
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' blob: https://www.gstatic.com;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com data:;
            img-src 'self' data: https://res.cloudinary.com;
            media-src 'self' blob: https://res.cloudinary.com;
            connect-src 'self' https://res.cloudinary.com https://api.cloudinary.com https://*.sentry.io;
            frame-ancestors 'none';
            base-uri 'self';
            form-action 'self';
        " always;

        client_max_body_size 20M;

        # ── Static files served directly by nginx (fast path) ──────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Repeat security headers — nginx does not inherit add_header from
            # the parent server block once a child location block defines its own.
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # ── Auth endpoints — strict rate limit ──────────────────────────────
        location ~* ^/(login|signup)/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://web:8000;
            include /etc/nginx/proxy_params;
        }

        # ── Analytics write API ──────────────────────────────────────────────
        location ~* ^/analytics/api/ {
            limit_req zone=analytics burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://web:8000;
            include /etc/nginx/proxy_params;
        }

        # ── Everything else ──────────────────────────────────────────────────
        location / {
            limit_req zone=general burst=60 nodelay;
            limit_req_status 429;
            proxy_pass http://web:8000;
            include /etc/nginx/proxy_params;
        }
    }
}
