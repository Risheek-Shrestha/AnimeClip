{# _report_modal.html — include once on streaming.html and streaming_movie.html #}
<div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header border-secondary">
        <h5 class="modal-title" id="reportModalLabel">⚠️ Report an Issue</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="report-form">
        {% csrf_token %}
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Reason</label>
            <select class="form-select bg-dark text-light border-secondary" name="reason" id="report-reason" required>
              <option value="">Select a reason…</option>
              <option value="broken_video">Broken / unplayable video</option>
              <option value="wrong_audio">Wrong audio track</option>
              <option value="wrong_subtitles">Wrong or missing subtitles</option>
              <option value="wrong_episode">Wrong episode content</option>
              <option value="copyright">Copyright violation</option>
              <option value="inappropriate">Inappropriate content</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Details <small class="text-muted">(optional)</small></label>
            <textarea class="form-control bg-dark text-light border-secondary" name="detail" id="report-detail"
                      rows="3" maxlength="500" placeholder="Describe the issue…"></textarea>
          </div>
          <div id="report-feedback" class="alert d-none"></div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger">Submit Report</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
  const form = document.getElementById('report-form');
  if (!form) return;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const reportUrl = document.body.dataset.reportUrl;
    if (!reportUrl) return;
    const fd = new FormData(form);
    fetch(reportUrl, { method: 'POST', body: fd,
      headers: { 'X-CSRFToken': fd.get('csrfmiddlewaretoken') }
    })
    .then(r => r.json())
    .then(data => {
      const fb = document.getElementById('report-feedback');
      fb.className = 'alert alert-success';
      fb.textContent = 'Report submitted. Thank you!';
      fb.classList.remove('d-none');
      setTimeout(() => {
        const modal = bootstrap.Modal.getInstance(document.getElementById('reportModal'));
        if (modal) modal.hide();
        fb.classList.add('d-none');
        form.reset();
      }, 2000);
    })
    .catch(() => {
      const fb = document.getElementById('report-feedback');
      fb.className = 'alert alert-danger';
      fb.textContent = 'Failed to submit report. Try again.';
      fb.classList.remove('d-none');
    });
  });
})();
</script>
