{% extends "base.html" %}
{% block content %}
<div class="container py-5 auth-container-480">
  <h2 class="mb-4">Change Password</h2>
  {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label text-light" for="{{ field.id_for_label }}">{{ field.label }}</label>
      <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
             class="form-control bg-dark text-light border-secondary{% if field.errors %} is-invalid{% endif %}"
             autocomplete="{{ field.html_name }}">
      {% for error in field.errors %}
        <div class="invalid-feedback">{{ error }}</div>
      {% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-warning w-100">Update Password</button>
    <a href="{% url 'profile' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
  </form>
</div>
{% endblock %}
