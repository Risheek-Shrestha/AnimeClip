{% extends 'base.html' %}
{% block body %}
<section class="sec-mar">
    <div class="container" style="max-width:520px; text-align:center; padding: 80px 20px;">
        <i class="fas fa-envelope-open-text" style="font-size:48px; color:#e63946; margin-bottom:20px;"></i>
        <h2 style="margin-bottom:12px;">Check your email</h2>
        <p style="opacity:0.7; line-height:1.7;">
            We sent a verification link to <strong>{{ email }}</strong>.<br>
            Click it to activate your account. Check your spam folder if you don't see it.
        </p>
    </div>
</section>
{% endblock body %}
