{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <h2>Set Up Two-Factor Authentication</h2>
  <p>Scan this QR code with an authenticator app (Google Authenticator, Authy, etc.).</p>
  <img src="data:image/png;base64,{{ qr_b64 }}" alt="TOTP QR Code" style="max-width:200px;">
  <p class="mt-3">Or enter the secret manually: <code>{{ secret }}</code></p>
  <form method="post" class="mt-4">{% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Enter the 6-digit code to confirm</label>
      <input name="code" type="text" inputmode="numeric" maxlength="6" class="form-control" autocomplete="one-time-code" required>
    </div>
    <button type="submit" class="btn btn-primary">Enable 2FA</button>
  </form>
</div>
{% endblock %}
