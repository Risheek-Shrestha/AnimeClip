{% extends 'base.html' %}
{% load static %}
{% block body %}
<section class="offline-page sec-mar">
  <div class="container text-center py-5">
    <div class="py-5">
      <div style="font-size:5rem">📡</div>
      <h2 class="mt-3">You're Offline</h2>
      <p class="text-muted">AnimeClip can't reach the internet right now. Check your connection and try again.</p>

      <a href="/" class="btn btn-outline-light mt-3 ms-2">🏠 Home</a>
    </div>
  </div>
</section>
{% endblock %}
