{% extends 'base.html' %}
{% load static %}

{% block body %}
<section class="breadcrumb sec-mar">
    <div class="container">
        <div class="breadcrumb-content">
            <ul>
                <li><a href="{% url 'index' %}">Home</a></li>
                <li><a class="active">Categories</a></li>
            </ul>
        </div>
    </div>
</section>

<section class="recent sec-mar">
    <div class="container">
        <div class="heading style-1">
            <h2>All Categories</h2>
        </div>
        <div class="row">
            {% for genre in genres %}
            <div class="col-xl-2 col-lg-3 col-sm-4 col-6 mb-4">
                <a href="{% url 'category_page' genre.name %}" class="text-decoration-none">
                    <div class="genre-card">
                        <p class="text mb-0">{{ genre.name }}</p>
                    </div>
                </a>
            </div>
            {% empty %}
            <div class="col-12 empty-state">
                <p>No categories found.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock body %}
