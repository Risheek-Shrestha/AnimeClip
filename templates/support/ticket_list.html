{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>My Support Tickets</h2>
    <a href="{% url 'support:ticket_create' %}" class="btn btn-primary">New Ticket</a>
  </div>
  {% for ticket in tickets %}
  <div class="card mb-2">
    <div class="card-body d-flex justify-content-between">
      <div><a href="{% url 'support:ticket_detail' ticket.pk %}">#{{ ticket.pk }} {{ ticket.subject }}</a></div>
      <span class="badge bg-secondary">{{ ticket.get_status_display }}</span>
    </div>
  </div>
  {% empty %}<p>No tickets yet.</p>{% endfor %}
</div>
{% endblock %}
